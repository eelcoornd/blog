<!doctype html>
<html lang="{{ site.Language.LanguageCode }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{ site.Params.description }}">
  <title>{{ if .IsHome }}{{ site.Title }}{{ else }}{{ .Title }} · {{ site.Title }}{{ end }}</title>
  <link rel="stylesheet" href="/css/main.css">
</head>
<body>
  <header>
    <a class="brand" href="/"><img class="brand-logo" src="/img/logo.svg" alt="{{ site.Title }}" height="56"></a>
    <nav aria-label="Main navigation">
      <a href="/work/">Work</a>
      <a href="/personal/">Personal</a>
    </nav>
  </header>
  <div class="layout">
    {{ partial "sidebar.html" . }}
    <main>{{ block "main" . }}{{ end }}</main>
  </div>
  <footer>
    <p>© {{ now.Year }} {{ site.Title }}</p>
    {{ with site.Params.linkedin }}
    <a class="social" href="{{ . }}" rel="me noopener" target="_blank" aria-label="LinkedIn">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor" aria-hidden="true">
        <path d="M4.98 3.5a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5zM3 9h4v12H3zM9 9h3.8v1.7h.05c.53-1 1.83-2.05 3.77-2.05 4.03 0 4.78 2.65 4.78 6.1V21h-4v-5.4c0-1.29-.02-2.95-1.8-2.95-1.8 0-2.07 1.4-2.07 2.85V21H9z"/>
      </svg>
      <span>LinkedIn</span>
    </a>
    {{ end }}
  </footer>
</body>
</html>
