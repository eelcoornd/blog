{{ define "main" }}
  <p class="intro">{{ site.Params.description }}</p>
  {{ range (where site.RegularPages "Section" "ne" "") }}
    <article>
      <h2><a href="{{ .RelPermalink }}">{{ .Title }}</a></h2>
      <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2 January 2006" }}</time>
      <p>{{ .Plain | truncate 160 " …" }} <a href="{{ .RelPermalink }}">Read more</a></p>
    </article>
  {{ else }}
    <p>No posts yet.</p>
  {{ end }}
{{ end }}
